name: Exchange Mail Bridge

on:
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "How many minutes back to scan"
        required: false
        default: "60"
      mail_top:
        description: "Maximum messages to import"
        required: false
        default: "30"
      mail_scan_top:
        description: "Maximum recent messages to scan before filters"
        required: false
        default: "200"
      include_attachments:
        description: "Download image attachments into Google Drive"
        required: false
        default: "true"
      max_attachment_bytes:
        description: "Maximum bytes per downloaded attachment"
        required: false
        default: "2500000"
      include_body_html:
        description: "Save full HTML mail bodies into Google Drive"
        required: false
        default: "true"
      max_body_html_chars:
        description: "Maximum HTML body characters to save per message"
        required: false
        default: "200000"
      dry_run_summary:
        description: "Only verify Exchange access and print a safe summary; do not post to Apps Script"
        required: false
        default: "false"
      poll_rounds:
        description: "How many polling rounds to run. Manual default is one immediate check."
        required: false
        default: "1"
      poll_interval_seconds:
        description: "Seconds to wait between polling rounds"
        required: false
        default: "300"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: exchange-mail-bridge-watch
  cancel-in-progress: false

jobs:
  sync-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      EWS_URL: ${{ secrets.EWS_URL }}
      EWS_EMAIL: ${{ secrets.EWS_EMAIL }}
      EWS_USERNAME: ${{ secrets.EWS_USERNAME }}
      EWS_PASSWORD: ${{ secrets.EWS_PASSWORD }}
      EWS_AUTH_TYPE: ${{ secrets.EWS_AUTH_TYPE }}
      EWS_VERIFY_TLS: ${{ secrets.EWS_VERIFY_TLS }}
      APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
      BRIDGE_TOKEN: ${{ secrets.BRIDGE_TOKEN }}
      MAIL_LOOKBACK_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_minutes || '360' }}
      MAIL_TOP: ${{ github.event_name == 'workflow_dispatch' && inputs.mail_top || '50' }}
      MAIL_SCAN_TOP: ${{ github.event_name == 'workflow_dispatch' && inputs.mail_scan_top || '200' }}
      MAIL_FROM_EMAIL_ALLOWLIST: ${{ secrets.MAIL_FROM_EMAIL_ALLOWLIST }}
      MAIL_INCLUDE_REGEX: ${{ secrets.MAIL_INCLUDE_REGEX }}
      MAIL_EXCLUDE_REGEX: ${{ secrets.MAIL_EXCLUDE_REGEX }}
      INCLUDE_ATTACHMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_attachments || 'true' }}
      MAX_ATTACHMENT_BYTES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_attachment_bytes || '2500000' }}
      INCLUDE_BODY_HTML: ${{ github.event_name == 'workflow_dispatch' && inputs.include_body_html || 'true' }}
      MAX_BODY_HTML_CHARS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_body_html_chars || '200000' }}
      DRY_RUN_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run_summary || 'false' }}
      MAIL_POLL_ROUNDS: ${{ github.event_name == 'workflow_dispatch' && inputs.poll_rounds || '60' }}
      MAIL_POLL_INTERVAL_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.poll_interval_seconds || '300' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r exchange_mail_bridge/requirements.txt

      - name: Sync Exchange inbox to Google Sheet
        shell: bash
        run: |
          set -u

          if [ "$DRY_RUN_SUMMARY" = "true" ]; then
            python exchange_mail_bridge/exchange_to_apps_script.py --dry-run-summary
            exit 0
          fi

          rounds="${MAIL_POLL_ROUNDS:-1}"
          interval="${MAIL_POLL_INTERVAL_SECONDS:-300}"
          failures=0

          echo "Starting Exchange mail watcher: rounds=${rounds}, interval_seconds=${interval}"

          for ((round=1; round<=rounds; round++)); do
            echo "::group::Poll ${round}/${rounds} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if python exchange_mail_bridge/exchange_to_apps_script.py; then
              echo "Poll ${round}/${rounds} completed."
            else
              failures=$((failures + 1))
              echo "::warning::Poll ${round}/${rounds} failed. Continuing so the watcher can recover from transient Exchange/GitHub issues."
            fi
            echo "::endgroup::"

            if [ "$round" -lt "$rounds" ]; then
              sleep "$interval"
            fi
          done

          if [ "$failures" -ge "$rounds" ]; then
            echo "::error::All polling rounds failed."
            exit 1
          elif [ "$failures" -gt 0 ]; then
            echo "::warning::${failures}/${rounds} polling rounds failed, but at least one round succeeded."
          else
            echo "All polling rounds succeeded."
          fi
