name: Send Aufschaltung Test Mail

on:
  workflow_dispatch:
    inputs:
      test_mail_to:
        description: "Recipient for the EWS test mail"
        required: false
        default: ""
      test_mail_subject:
        description: "Optional test mail subject"
        required: false
        default: ""

jobs:
  send-test-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EWS_URL: ${{ secrets.EWS_URL }}
      EWS_EMAIL: ${{ secrets.EWS_EMAIL }}
      EWS_USERNAME: ${{ secrets.EWS_USERNAME }}
      EWS_PASSWORD: ${{ secrets.EWS_PASSWORD }}
      EWS_AUTH_TYPE: ${{ secrets.EWS_AUTH_TYPE }}
      EWS_VERIFY_TLS: ${{ secrets.EWS_VERIFY_TLS }}
      TEST_MAIL_TO: ${{ inputs.test_mail_to }}
      TEST_MAIL_SUBJECT: ${{ inputs.test_mail_subject }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r exchange_mail_bridge/requirements.txt

      - name: Send EWS test mail
        run: python exchange_mail_bridge/send_test_mail.py
